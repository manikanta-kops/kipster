name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App and Core versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove anything private.
      render: text
