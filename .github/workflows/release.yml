name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: plan
        run: node scripts/release.mjs plan | tee -a "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    uses: ./.github/workflows/release-build.yml
    with:
      packages: ${{ needs.plan.outputs.packages }}
      ref: ${{ github.sha }}
    secrets: inherit

  channels:
    needs: publish
    if: always() && !cancelled() && needs.publish.result != 'skipped'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
