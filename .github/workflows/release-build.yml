name: Build and publish packages

on:
  workflow_call:
    inputs:
      packages:
        description: JSON list from `node scripts/release.mjs plan`
        type: string
        required: true
      ref:
        description: Commit to build
        type: string
        required: true
      snapshot:
        description: Snapshot stamp for next builds; empty for stable releases
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.package.name }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    runs-on: ${{ matrix.package.runner }}
    environment: release
    env:
      NAME: ${{ matrix.package.name }}
      TAG: ${{ matrix.package.tag }}
      VERSION: ${{ matrix.package.version }}
      REF: ${{ inputs.ref }}
      SNAPSHOT: ${{ inputs.snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust
        if: matrix.package.app
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin
      - run: npm ci
      - name: Apply the next version
        if: inputs.snapshot != ''
        run: npx changeset version --snapshot "$SNAPSHOT"
      # The installer ships Kipster.app, the identity macOS privacy uses for Core
      # and its children. Publishing fails rather than ship it unsigned.
      - name: Sign and notarize the Kipster backend app
        if: matrix.package.backend
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            if [ -z "${!name}" ]; then echo "::error::$name is required to sign the installer's Kipster backend app."; exit 1; fi
          done
          keychain="$RUNNER_TEMP/kipster-backend.keychain-db"
          password="$(uuidgen)"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/backend.p12" "$RUNNER_TEMP/backend-notary.p8" "$RUNNER_TEMP/Kipster.zip"
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/backend.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/backend.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          node installer/native/build.mjs --identity "$SIGNING_IDENTITY" --keychain "$keychain"
          app=installer/launchers/macos/Kipster.app
          codesign --verify --strict --verbose=2 "$app"
          codesign -d -r- "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Kipster.zip"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/backend-notary.p8"
          xcrun notarytool submit "$RUNNER_TEMP/Kipster.zip" --key "$RUNNER_TEMP/backend-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          submission="$(jq -r .id "$RUNNER_TEMP/notary.json")"
          xcrun notarytool log "$submission" --key "$RUNNER_TEMP/backend-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
          if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != Accepted ]; then echo "::error::Notarization of the Kipster backend app was not accepted."; exit 1; fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Build
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP: ${{ matrix.package.app }}
        run: |
          set -euo pipefail
          if [ "$APP" = true ] && [ -n "$CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$CERTIFICATE_PASSWORD" APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
            if [ -n "$NOTARY_KEY" ]; then
              printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
              export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_ISSUER="$NOTARY_ISSUER" APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
            fi
          fi
          node scripts/release.mjs build "$NAME" "$RUNNER_TEMP/release"
          # Tauri notarizes the app inside; the disk image needs its own ticket.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            for dmg in "$RUNNER_TEMP"/release/*.dmg; do
              xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$dmg"
            done
          fi
          # Stapling changes the DMG bytes; hash the final files that will be published.
          node scripts/release.mjs metadata "$NAME" "$RUNNER_TEMP/release"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.mjs notes "$NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=--prerelease=false
          if [ -n "$SNAPSHOT" ]; then prerelease=--prerelease; fi
          gh release create "$TAG" "$RUNNER_TEMP"/release/* "$prerelease" --latest=false \
            --target "$REF" --title "$NAME $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
