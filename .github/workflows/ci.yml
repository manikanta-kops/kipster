name: CI

on:
  pull_request:
    branches: [next, master]
  push:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset and scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Release pull requests and next-to-master merges consume changesets; Dependabot adds none.
      - name: Every changed package has a changeset
        if: github.base_ref == 'next' && !startsWith(github.head_ref, 'release/') && github.event.pull_request.user.login != 'dependabot[bot]'
        run: npx changeset status --since=origin/next
      - name: Script tests
        run: node --test scripts/tests/*.test.mjs

  core:
    name: Core
    runs-on: ubuntu-latest
    env:
      # PRs compare with their base; a next push compares with next before the push.
      KIPSTER_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Database migrations only move forward
        run: npm run check:migrations -w core
      - run: npm run test:scripts -w core
      - run: npm run typecheck -w core
      - run: npm run check:boundaries -w core
      - name: Install PostgreSQL 18 with pgvector
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-18-pgvector
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Protocol changes are additive
        run: |
          git show "$KIPSTER_MIGRATION_BASE:core/protocol-shape.json" > "$RUNNER_TEMP/protocol-shape.json" || rm -f "$RUNNER_TEMP/protocol-shape.json"
          npm run protocol:check -w core -- --base "$RUNNER_TEMP/protocol-shape.json"
      - run: npm run test:postgres -w core
      - run: npm run test:package -w core

  adapters:
    name: Adapters
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w core
      - run: npm run check -w adapters

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w core
      - name: Install PostgreSQL 18 with pgvector
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-18-pgvector
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: npm run test:postgres -w installer

  installer-macos:
    name: Installer macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Compiles and ad hoc signs the Kipster app; release signing needs the
      # release environment, which pull requests cannot use.
      - run: npm run build:macos -w installer
      - run: node --test installer/tests/launcher.test.mjs

  ui:
    name: UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w core
      - run: npm run check -w interface/kipster-ui
      - run: npm run test:fake-core -w interface/kipster-ui
