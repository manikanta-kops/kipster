version: 2
updates:
  # Tauri's npm and Rust packages must share a minor version; upgrade them together by hand.
  - package-ecosystem: npm
    directory: /
    target-branch: next
    ignore:
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-minor']
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /interface/kipster-ui/src-tauri
    target-branch: next
    ignore:
      - dependency-name: 'tauri*'
        update-types: ['version-update:semver-minor']
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
